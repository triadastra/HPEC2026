# Variant: grid tag for the grid-native SSMs (2d) -- s4nd, mamba_nd.
# These models contain NO attention: S4ND mixes with separable DPLR kernels and
# Mamba-ND with an ordered scan. The tag only selects how many lattice axes are
# promoted: State. Formerly (mis)named cross_attention_2d.

model:
  variant: grid_2d

