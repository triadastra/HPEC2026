# @package _global_
defaults:
  - /trainer: default
  - /loader: default
  - /task: regression
  - /optimizer: adamw
  - /scheduler: plateau
  - /model: s4
  - /dataset: flat

encoder:
  - _name_: scid
    d_state: 8
    d_comm: 32
  - _name_: flowid
    d_flow: 2
  - linear

decoder:
  _name_: sequence
  mode: last

model:
  n_layers: 4
  d_model: 256
  dropout: 0.1
  prenorm: true
  transposed: false
  layer:
    _name_: s4
    d_state: 256
    bidirectional: false

loader:
  batch_size: 128
  num_workers: 8
  drop_last: false

loader_train:
  batch_size: 128

optimizer:
  lr: 1e-3
  weight_decay: 1e-4

train:
  monitor: val/loss
  mode: min
  interval: epoch
  max_steps: null
  test: true
  seed: 1337

trainer:
  max_epochs: 200
  accelerator: auto
  devices: 1
  precision: 16
  val_check_interval: 1.0


