# @package _global_
defaults:
  - /trainer: default
  - /loader: default
  - /task: regression
  - /optimizer: adamw
  - /scheduler: plateau
  - /model: s4
  - /dataset: s4_onehot_u

encoder:
  - linear

decoder:
  _name_: sequence
  mode: last

model:
  n_layers: 4
  d_model: 128  # standardized to 128 to capacity-match the github baselines (was 256)
  dropout: 0.1  # standardized to 0.1 across the sweep (uniform regularization)
  prenorm: true
  transposed: false
  layer:
    _name_: s4
    d_state: 128  # SSM state size standardized to 128 across the S4 family (was 256)
    bidirectional: false

loader:
  batch_size: 64  # small batch, matches the github per-series (flat) models (was 256)
  num_workers: 0
  drop_last: false
loader_train:
  batch_size: 64

optimizer:
  lr: 1e-3
  weight_decay: 1e-4

train:
  monitor: val/loss
  mode: min
  interval: epoch
  max_steps: null
  test: true
  seed: 1337

trainer:
  max_epochs: 10
  accelerator: auto
  devices: 1
  precision: 32  # fp32 across the sweep (was 16) — removes the fp16-vs-fp32 confound vs the github models
  val_check_interval: 1.0

dataset:
  _name_: s4_onehot_u
  data_dir: /root
  input_len: 36
  lag_count: 12
