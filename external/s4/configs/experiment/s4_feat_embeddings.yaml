# @package _global_
# S4 on the ext/ feature-augmented tensors. Mirrors experiment/s4_embeddings.yaml
# but swaps the dataset for the tensors-backed one. Choose the feature set with
#   dataset.tensors=.../feature_tensors_{base,exog}.pt
defaults:
  - /trainer: default
  - /loader: default
  - /task: regression
  - /optimizer: adamw
  - /scheduler: plateau
  - /model: s4
  - /dataset: s4_feat_embeddings

encoder:
  - _name_: tradeid
    d_state: 8
    d_comm: 32
    d_flow: 2
  - linear

decoder:
  _name_: sequence
  mode: last

model:
  n_layers: 4
  d_model: 256
  dropout: 0.1
  prenorm: true
  transposed: false
  layer:
    _name_: s4
    d_state: 256
    bidirectional: false

loader:
  batch_size: 256
  num_workers: 0
  drop_last: false
loader_train:
  batch_size: 256

optimizer:
  lr: 1e-3
  weight_decay: 1e-4

train:
  monitor: val/loss
  mode: min
  interval: epoch
  max_steps: null
  test: true
  seed: 1337

trainer:
  max_epochs: 200
  accelerator: auto
  devices: 1
  precision: 16
  val_check_interval: 1.0

dataset:
  _name_: s4_feat_embeddings
  tensors: /root/full/ext/data/processed/feature_tensors.pt
