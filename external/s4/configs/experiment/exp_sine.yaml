# @package _global_
defaults:
  - /trainer: default
  - /loader: default
  - /task: regression
  - /optimizer: adamw
  - /scheduler: plateau
  - /model: s4
  - /dataset: tensor_sine

encoder: linear
decoder:
  _name_: sequence
  mode: last

model:
  n_layers: 2
  d_model: 64
  dropout: 0.1
  prenorm: true
  transposed: false
  layer:
    _name_: s4
    d_state: 32
    bidirectional: true

loader:
  batch_size: 64
  num_workers: 4
  drop_last: false

train:
  monitor: val/loss
  mode: min
  interval: epoch
  max_steps: null
  test: true
  seed: 42

trainer:
  max_epochs: 50
  accelerator: auto
  devices: 1
  precision: 16
  val_check_interval: 1.0


