name: Restore pinned vendor assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore exact upstream Git objects and verify release tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY_RESTORE'
          import base64, hashlib, json, os, pathlib, urllib.request
          items = [{'path': 'external/cafa-authors/assets/u10m.gif', 'mode': '100644', 'sha': '6ad9e9dea7b0d682a9d4f03ad841e2ab61aa57e9', 'bytes': 10522704, 'repo': 'BaratiLab/CaFA'}, {'path': 'external/mamba/assets/mamba3.png', 'mode': '100644', 'sha': '580001b8e25cc6f98aba461e800a93fa7bb2e540', 'bytes': 181058, 'repo': 'state-spaces/mamba'}, {'path': 'external/mamba/assets/selection.png', 'mode': '100644', 'sha': '69b109a8eed4e3c7516b23e2b39d37e842a4464b', 'bytes': 818624, 'repo': 'state-spaces/mamba'}, {'path': 'external/mamba/assets/ssd_algorithm.png', 'mode': '100644', 'sha': 'c8976a7c02fe06f630645a0d294a9dc3b5b29f48', 'bytes': 1118415, 'repo': 'state-spaces/mamba'}, {'path': 'external/s4/assets/hippo.png', 'mode': '100644', 'sha': '58d83b6078aedad30cdf31e0a46148e42f100e04', 'bytes': 186257, 'repo': 'state-spaces/s4'}, {'path': 'external/s4/assets/httyh.png', 'mode': '100644', 'sha': '6318931a02f123858f3828fef291bd2416126a3f', 'bytes': 247769, 'repo': 'state-spaces/s4'}, {'path': 'external/s4/assets/properties.png', 'mode': '100644', 'sha': 'c606a95463b6bc58e2f0fa3c7bd308262ef515e6', 'bytes': 208602, 'repo': 'state-spaces/s4'}, {'path': 'external/s4/assets/s4.png', 'mode': '100644', 'sha': 'c606a95463b6bc58e2f0fa3c7bd308262ef515e6', 'bytes': 208602, 'repo': 'state-spaces/s4'}, {'path': 'external/s4/assets/s4d.png', 'mode': '100644', 'sha': 'd6ce9eeefcc97471891087c35d11125704fc4d45', 'bytes': 370089, 'repo': 'state-spaces/s4'}, {'path': 'external/s4/assets/s4nd.png', 'mode': '100644', 'sha': '445c1fe9f7bb93477c5d6c81feeacaf6856fcc03', 'bytes': 2493248, 'repo': 'state-spaces/s4'}, {'path': 'external/s4/assets/sashimi.png', 'mode': '100644', 'sha': 'cddc2fb680aa7e1541f0bca2028ec970e6724117', 'bytes': 951264, 'repo': 'state-spaces/s4'}, {'path': 'external/s4/assets/splash.png', 'mode': '100644', 'sha': 'd999cec1f5ca9dbb89dfbf6f52f8ce6bf79fb2db', 'bytes': 346845, 'repo': 'state-spaces/s4'}, {'path': 'external/s4/configs/experiment/mega/lra-image/mega_ablations_10000_warmup_all.pdf', 'mode': '100644', 'sha': '396b2d71b9de3697c76905981a16058307143a37', 'bytes': 60750, 'repo': 'state-spaces/s4'}, {'path': 'external/s4/configs/experiment/mega/lra-image/mega_ablations_1000_warmup_all.pdf', 'mode': '100644', 'sha': 'a8fc74fb55a95580e8ab51adcd8ad3b733e06a52', 'bytes': 33564, 'repo': 'state-spaces/s4'}, {'path': 'external/s4/configs/experiment/mega/lra-image/mega_ablations_mega_repo.pdf', 'mode': '100644', 'sha': '05b3ff44fc41c780d10912925dd811083ac133b9', 'bytes': 24270, 'repo': 'state-spaces/s4'}, {'path': 'external/s4/notebooks/hippo_function_approximation.ipynb', 'mode': '100644', 'sha': 'd31f21faef74663b84c94fa919dbc2f1b33bb926', 'bytes': 29872138, 'repo': 'state-spaces/s4'}, {'path': 'external/s4/notebooks/ssm_kernels.ipynb', 'mode': '100644', 'sha': '2c39c04576dc483cce1f81f0fa68bb8db16a4622', 'bytes': 2274484, 'repo': 'state-spaces/s4'}]
          for item in items:
              request = urllib.request.Request('https://api.github.com/repos/' + item['repo'] + '/git/blobs/' + item['sha'], headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=180) as response:
                  payload = json.load(response)
              assert payload['encoding'] == 'base64'
              data = base64.b64decode(payload['content'])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == item['sha'], item['path']
              target = pathlib.Path(item['path'])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print('Verified', item['path'], flush=True)
          PY_RESTORE
          git add external
          cp .git/index .git/verify-index
          GIT_INDEX_FILE="$PWD/.git/verify-index" git update-index --force-remove .github/workflows/restore-vendor-assets.yml
          actual=$(GIT_INDEX_FILE="$PWD/.git/verify-index" git write-tree)
          test "$actual" = "3e0b716d85b5739a08e68ad3d579d12beaf67097"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore checksum-verified upstream example assets'
          git push origin HEAD:main
